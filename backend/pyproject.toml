[project]
name = "tvu-virtual-campus-tour-backend"
version = "1.0.0"
description = "TVU Virtual Campus Tour — FastAPI Backend"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
