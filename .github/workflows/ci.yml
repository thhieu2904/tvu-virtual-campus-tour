name: Continuous Integration

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-ci:
    name: Frontend Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Linter
        run: |
          cd frontend
          npm run lint --if-present

      - name: Test Production Build
        run: |
          cd frontend
          # Disable Next.js telemetry
          export NEXT_TELEMETRY_DISABLED=1
          # Use dummy variables for compile-time environment checks
          export NEXT_PUBLIC_SUPABASE_URL=https://dummy.supabase.co
          export NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy
          npm run build

  backend-ci:
    name: Backend Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter/Formatter
        run: |
          cd backend
          # Run linter checks if configured
          pip install ruff
          ruff check . --ignore E501
